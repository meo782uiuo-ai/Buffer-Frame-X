name: Build GD 2.2081

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: iOS
            os: macos-latest
            target: iOS
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }} (GD 2.2081)
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Patch mod.json for GD 2.2081
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open('mod.json'))
          m['geode'] = 'v5.11.2'
          m['gd'] = {p: '2.2081' for p in ('win', 'android', 'mac', 'ios')}
          json.dump(m, open('mod.json', 'w'), indent=2)
          PY

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds (GD 2.2081)
    runs-on: ubuntu-latest
    needs: ["build"]

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: BufferFrame-GD-2.2081
          path: ${{ steps.build.outputs.build-output }}
          
